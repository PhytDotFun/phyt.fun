name: Release Images
on:
    push:
        tags:
            - 'v*'

concurrency:
    group: release-images
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service:
                    - name: hono-api
                      dockerfile: Dockerfile
                      context: .
                      buildargs: |
                          PROJECT=hono-api
                    - name: workers
                      dockerfile: Dockerfile
                      context: .
                      buildargs: |
                          PROJECT=workers

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Normalize repo path to lowercase # CHANGED: required for GHCR
              run: |
                  echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
                  echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"   # e.g. v1.2.3

            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push ${{ matrix.service.name }}
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.service.context }}
                  file: ${{ matrix.service.dockerfile }}
                  push: true
                  build-args: ${{ matrix.service.buildargs }}
                  tags: | # CHANGED: lowercase repo path + release tag + latest
                      ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.service.name }}:${{ env.TAG_NAME }}
                      ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.service.name }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
