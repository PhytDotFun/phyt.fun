name: Release Pull Request

on:
    push:
        branches: [main]
    workflow_dispatch: {}

concurrency:
    group: release-pr
    cancel-in-progress: true

permissions:
    contents: write # required to push release commit/PR
    pull-requests: write # required to open/update PR

jobs:
    release-pr:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with: { version: 10 }

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: 'pnpm'

            - run: pnpm -w install --frozen-lockfile

            - name: Create or update Release PR via Changesets
              uses: changesets/action@v1
              with:
                  # CHANGED: avoid assuming yarn/pnpm; use npx for portability
                  version: pnpm changeset version # We do not publish here; images are built on tags in a separate workflow.
                  publish: echo "skip publish"
                  title: 'Release: version packages'
                  commit: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
