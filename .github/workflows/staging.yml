name: Staging CI

on:
  push:
    branches: [staging, "ci/**"]
  workflow_dispatch: {}

concurrency:
  group: staging-ci
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: hono-api
            dockerfile: Dockerfile
            context: .
            buildargs: |
              PROJECT=hono-api
          - name: workers
            dockerfile: Dockerfile
            context: .
            buildargs: |
              PROJECT=workers
    outputs:
      skipped: ${{ steps.check_skip.outputs.skipped }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      repo_lc: ${{ steps.meta.outputs.repo_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for [skip build]
        id: check_skip
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[skip build]"* ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ '${{ steps.check_skip.outputs.skipped }}' == 'true' ]]; then
            echo "image_tag=staging" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=staging-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.check_skip.outputs.skipped == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check_skip.outputs.skipped == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service.name }}
        if: steps.check_skip.outputs.skipped == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: ${{ matrix.service.buildargs }}
          # Build for your Spot ARM64 instance; use dual if you want multi-arch manifests:
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lc }}/${{ matrix.service.name }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lc }}/${{ matrix.service.name }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    environment: staging
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
      SHORT_SHA: ${{ needs.build-images.outputs.short_sha }}
      REPO_LC: ${{ needs.build-images.outputs.repo_lc }}
      TS_SSH_DEST: staging-${{ needs.build-images.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Get GitHub OIDC ID token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const aud = `https://github.com/${{ github.repository }}`;
            const idt = await core.getIDToken(aud);
            core.setOutput('jwt', idt);

      - name: Login to Vault via JWT
        id: vault_login
        env:
          VAULT_ADDR: ${{ env.VAULT_ADDR }}
          GITHUB_ID_TOKEN: ${{ steps.oidc.outputs.jwt }}
        run: |
          set -euo pipefail
          VAULT_TOKEN=$(curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d '{"jwt":"'"${GITHUB_ID_TOKEN}"'","role":"gh-staging"}' \
            "${VAULT_ADDR}/v1/auth/jwt/login" | jq -er '.auth.client_token')
          echo "::add-mask::${VAULT_TOKEN}"
          echo "VAULT_TOKEN=${VAULT_TOKEN}" >> "$GITHUB_ENV"

      - name: Export Cloudflare token from Vault
        env:
          VAULT_ADDR: ${{ env.VAULT_ADDR }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
        run: |
          set -euo pipefail
          cf_json=$(curl -fsS -H "X-Vault-Token: ${VAULT_TOKEN}" \
          "${VAULT_ADDR}/v1/secret/data/staging/cloudflare")
          CF_TOKEN=$(echo "$cf_json" | jq -er '.data.data.API_TOKEN')
          echo "::add-mask::${CF_TOKEN}"
          echo "TF_VAR_cloudflare_api_token=${CF_TOKEN}" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=${CF_TOKEN}" >> "$GITHUB_ENV"

      - name: Terraform init/plan/apply (staging infra)
        working-directory: infra/environments/aws-staging
        env:
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_deployment_id: ${{ env.SHORT_SHA }}
          TF_VAR_vault_addr: ${{ env.VAULT_ADDR }}
          VAULT_ADDR: ${{ env.VAULT_ADDR }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform plan -out=plan.tfplan -input=false
          terraform apply -input=false -auto-approve plan.tfplan

      - name: Mint approle credentials
        id: approle
        env:
          VAULT_ADDR: ${{ env.VAULT_ADDR }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
        run: |
          set -euo pipefail
          ROLE="staging-app"
          HDRS=(-H "X-Vault-Token: ${VAULT_TOKEN}")
          ROLE_ID=$(curl -fsS "${HDRS[@]}" \
            "${VAULT_ADDR}/v1/auth/approle/role/${ROLE}/role-id" | jq -er '.data.role_id')
          SECRET_ID=$(curl -fsS -X POST "${HDRS[@]}" \
            -H "Content-Type: application/json" \
            -d '{"num_uses":1,"ttl":"30m"}' \
            "${VAULT_ADDR}/v1/auth/approle/role/${ROLE}/secret-id" | jq -er '.data.secret_id')
          echo "::add-mask::${ROLE_ID}"
          echo "::add-mask::${SECRET_ID}"
          { echo "ROLE_ID=${ROLE_ID}"; echo "SECRET_ID=${SECRET_ID}"; } >> "$GITHUB_ENV"

      - name: Wait for Tailscale node to be ready
        run: |
          echo "Waiting for ${TS_SSH_DEST} to appear in Tailscale network..."
          for i in {1..30}; do
            if tailscale status --json | jq -e --arg hostname "${TS_SSH_DEST}" '.Peer[] | select(.HostName == $hostname)' > /dev/null; then
              echo "Found ${TS_SSH_DEST} in Tailscale network"
              break
            fi
            echo "Attempt $i/30: ${TS_SSH_DEST} not found, waiting 10 seconds..."
            sleep 10
          done

          if ! timeout 10s tailscale ping "${TS_SSH_DEST}"; then
            echo "ERROR: Cannot ping ${TS_SSH_DEST}"
            echo "Current Tailscale status:"
            tailscale status
            # Sometimes the device is ready but ping fails - try SSH directly
            echo "Attempting direct SSH test..."
            if tailscale ssh "${TS_SSH_DEST}" 'echo "SSH connection successful"' 2>/dev/null; then
              echo "SSH connection works, proceeding despite ping failure"
            else
              echo "SSH also failed, exiting"
              exit 1
            fi
          else
            echo "${TS_SSH_DEST} is ready"
          fi

      - name: Ensure phyt directory exists
        run: |
          tailscale ssh "ubuntu@${TS_SSH_DEST}" 'sudo mkdir -p /opt/phyt && sudo chown $USER:$USER /opt/phyt'

      - name: Ship compose bundle to host
        run: |
          set -euo pipefail
          tar -czf - docker-compose.yml tooling \
            | tailscale ssh "ubuntu@${TS_SSH_DEST}" 'tar -xzf - -C /opt/phyt'

      - name: Remote deploy over Tailscale SSH
        env:
          GHCR_RO_TOKEN: ${{ secrets.GHCR_RO_TOKEN }}
        run: |
          set -euo pipefail
          tailscale ssh "ubuntu@${TS_SSH_DEST}" 'bash -lc "set -a; . /dev/stdin; set +a; \
            docker login ghcr.io -u ${GITHUB_ACTOR} -p ${GHCR_RO_TOKEN:-} >/dev/null 2>&1 || true; \
            cd /opt/phyt && docker compose pull && docker compose up -d --remove-orphans; \
            docker logout ghcr.io >/dev/null 2>&1 || true"' <<EOF
              IMAGE_REGISTRY=${{ env.REGISTRY }}
              GITHUB_REPOSITORY=${{ env.REPO_LC }}
              IMAGE_TAG=${{ env.IMAGE_TAG }}
              COMPOSE_PROFILES=staging
              VAULT_ADDR=${{ env.VAULT_ADDR }}
              VAULT_ROLE_ID=${{ env.ROLE_ID }}
              VAULT_SECRET_ID=${{ env.SECRET_ID }}
            EOF
