; Baseline for dev/local only. In real deployments, Vault Agent renders the final .ini.
; Prod posture below (scram + auth_query). Staging will render trust via template.

[databases]
; Local/dev placeholder ONLY. The rendered template will override in real deploys.
appdb = host=postgres port=5432 dbname=phyt_db user=phyt_user password=phyt_password

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; For production, prefer DB-side auth via auth_query (no app creds in .ini)
auth_type = scram-sha-256
auth_user = pgbouncer_auth
auth_query = SELECT username, password FROM pgbouncer.get_auth($1)

; Pooling
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 5.0

; TLS (nginx?)
; client_tls_sslmode = require
; client_tls_key_file = /etc/pgbouncer/tls/tls.key
; client_tls_cert_file = /etc/pgbouncer/tls/tls.crt
; client_tls_ca_file = /etc/pgbouncer/tls/ca.crt

; Server/DB settings
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
server_lifetime = 3600
server_idle_timeout = 600
query_wait_timeout = 120
server_round_robin = 1
server_fast_close = 0

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

admin_users = postgres
stats_users = postgres

; Timeouts
tcp_keepalive = 1
tcp_keepcnt = 9
tcp_keepidle = 7200
tcp_keepintvl = 75

max_db_connections = 10000
